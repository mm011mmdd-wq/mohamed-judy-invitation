<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف | محمد وجودي</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700;800&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <style>
        :root {
            --royal-blue: #0a192f;
            --royal-blue-light: #112240;
            --royal-blue-card: rgba(17, 34, 64, 0.75);
            --silver: #e6f1ff;
            --silver-bright: #ffffff;
            --silver-metallic: linear-gradient(135deg, #e6e6e6 0%, #ffffff 50%, #b3b3b3 100%);
            --silver-border: rgba(192, 192, 192, 0.35);
            --silver-glow: rgba(192, 192, 192, 0.25);
            --font-ar: 'Cairo', sans-serif;
            --font-ar-title: 'Amiri', serif;
            --font-en: 'Cinzel', serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
        body {
            background: radial-gradient(circle at center, #0f2744 0%, #0a192f 60%, #040c1a 100%);
            color: var(--silver);
            font-family: var(--font-ar);
            text-align: center;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 40px 70px, rgba(192,192,192,0.8), rgba(0,0,0,0)),
                        radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 160px 120px, rgba(230,241,255,0.9), rgba(0,0,0,0));
            background-repeat: repeat; background-size: 200px 200px; opacity: 0.15; z-index: 0; pointer-events: none;
        }
        .controls-container {
            position: fixed; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 1000; pointer-events: none;
        }
        .controls-container * { pointer-events: auto; }
        .btn-control {
            background: rgba(10, 25, 47, 0.65);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--silver-border); color: var(--silver-bright);
            padding: 10px 18px; border-radius: 30px; cursor: pointer;
            font-size: 0.9rem; font-family: var(--font-ar); font-weight: 600;
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex; align-items: center; gap: 8px;
        }
        .btn-control:hover {
            background: rgba(192, 192, 192, 0.25); border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-2px); box-shadow: 0 6px 20px var(--silver-glow);
        }
        .music-btn { width: 45px; height: 45px; border-radius: 50%; padding: 0; justify-content: center; }
        .wrapper { position: relative; z-index: 1; max-width: 750px; margin: 0 auto; padding: 80px 20px 40px 20px; }
        .card {
            background: var(--royal-blue-card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--silver-border); border-radius: 24px; padding: 45px 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.05);
            position: relative; overflow: hidden;
        }
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--silver-metallic); }
        .monogram {
            width: 70px; height: 70px; margin: 0 auto 20px auto;
            border: 2px solid rgba(192, 192, 192, 0.5); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-en); font-size: 1.5rem; font-weight: 700; color: #ffffff;
            box-shadow: 0 0 20px var(--silver-glow); background: rgba(255,255,255,0.03);
        }
        .subtitle { font-size: 1.1rem; letter-spacing: 2px; color: #cbd5e1; margin-bottom: 15px; font-weight: 400; }
        .names {
            font-family: var(--font-ar-title); font-size: 3.2rem; font-weight: 700;
            background: linear-gradient(180deg, #ffffff 0%, #c0c0c0 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 15px; line-height: 1.2; text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }
        .invitation-text { color: #94a3b8; font-size: 1rem; margin-bottom: 35px; line-height: 1.6; }
        .countdown-title { font-size: 0.95rem; color: #cbd5e1; margin-bottom: 15px; letter-spacing: 1px; }
        .countdown { display: flex; justify-content: center; gap: 12px; margin-bottom: 40px; direction: ltr; }
        .time-box {
            background: rgba(10, 25, 47, 0.85); border: 1px solid var(--silver-border);
            padding: 12px 8px; border-radius: 14px; min-width: 70px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); transition: transform 0.3s ease;
        }
        .time-box:hover { transform: translateY(-3px); border-color: rgba(255, 255, 255, 0.6); }
        .time-box .num { display: block; font-size: 1.8rem; font-weight: 700; color: #ffffff; font-family: var(--font-en); }
        .time-box .label { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; display: block; }
        .details-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 35px; }
        .detail-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(192, 192, 192, 0.18);
            padding: 22px 15px; border-radius: 16px; transition: all 0.3s ease;
        }
        .detail-card:hover { border-color: rgba(255, 255, 255, 0.5); background: rgba(255, 255, 255, 0.06); transform: translateY(-4px); }
        .detail-card i { font-size: 1.8rem; color: #e2e8f0; margin-bottom: 12px; filter: drop-shadow(0 0 8px var(--silver-glow)); }
        .detail-card h3 { font-size: 1.1rem; color: #ffffff; margin-bottom: 6px; font-weight: 600; }
        .detail-card p { font-size: 0.92rem; color: #94a3b8; }
        .rsvp-container { margin-top: 10px; }
        .rsvp-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); color: #ffffff;
            padding: 16px 36px; border-radius: 50px; text-decoration: none; font-weight: 700;
            font-size: 1.1rem; border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4), 0 0 15px var(--silver-glow);
            transition: all 0.3s ease; width: 100%; max-width: 320px;
        }
        .rsvp-btn:hover { transform: scale(1.04); background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); box-shadow: 0 12px 30px rgba(37, 99, 235, 0.6), 0 0 25px rgba(255, 255, 255, 0.6); }
        .rsvp-btn i { font-size: 1.3rem; color: #25d366; }
        .footer-note { margin-top: 30px; font-size: 0.8rem; color: #64748b; letter-spacing: 1px; }
        body.en { font-family: var(--font-en); direction: ltr; }
        body.en .names { font-family: var(--font-en); font-size: 2.8rem; letter-spacing: 1px; }
        body.en .btn-control { font-family: var(--font-en); }
        @media (max-width: 480px) {
            .wrapper { padding-top: 75px; } .card { padding: 35px 18px; }
            .names { font-size: 2.5rem; } .countdown { gap: 8px; }
            .time-box { min-width: 60px; padding: 10px 5px; } .time-box .num { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="controls-container">
        <button class="btn-control music-btn" onclick="toggleAudio()" title="تشغيل / إيقاف الموسيقى">
            <i id="musicIcon" class="fas fa-music"></i>
        </button>
        <button class="btn-control" onclick="toggleLanguage()">
            <i class="fas fa-globe"></i> <span id="langText">English</span>
        </button>
    </div>
    <audio id="pianoAudio" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=soft-piano-100-bpm-121529.mp3"></audio>
    <div class="wrapper">
        <div class="card" data-aos="fade-up" data-aos-duration="1200">
            <div class="monogram">M & J</div>
            <div class="subtitle" id="subTitle">دعوة زفاف فاخرة</div>
            <div class="names" id="namesText">محمد & جودي</div>
            <p class="invitation-text" id="inviteText">يتشرفان بدعوتكم لمشاركتهما أجمل لحظات العمر في حفل الزفاف السعيد</p>
            <div class="countdown-title" id="countTitle">المتبقي على يومنا المميز:</div>
            <div class="countdown" data-aos="zoom-in" data-aos-delay="200">
                <div class="time-box"><span class="num" id="days">00</span><span class="label" id="lblDays">يوم</span></div>
                <div class="time-box"><span class="num" id="hours">00</span><span class="label" id="lblHours">ساعة</span></div>
                <div class="time-box"><span class="num" id="mins">00</span><span class="label" id="lblMins">دقيقة</span></div>
                <div class="time-box"><span class="num" id="secs">00</span><span class="label" id="lblSecs">ثانية</span></div>
            </div>
            <div class="details-grid">
                <div class="detail-card" data-aos="fade-up" data-aos-delay="300"><i class="far fa-calendar-alt"></i><h3 id="dateTitle">التاريخ</h3><p id="dateVal">الجمعة، 7 أغسطس 2026</p></div>
                <div class="detail-card" data-aos="fade-up" data-aos-delay="400"><i class="far fa-clock"></i><h3 id="timeTitle">الوقت</h3><p id="timeVal">8:00 مساءً</p></div>
                <div class="detail-card" data-aos="fade-up" data-aos-delay="500"><i class="fas fa-map-marker-alt"></i><h3 id="venueTitle">المكان</h3><p id="venueVal">قاعة ليليتي</p></div>
            </div>
            <div class="rsvp-container" data-aos="fade-up" data-aos-delay="600">
                <a href="https://wa.me/201224992674?text=%D8%A3%D9%84%D9%81%20%D9%85%D8%A8%D8%B1%D9%88%D9%83%D9%8D!%20%D9%8A%D8%B3%D8%B9%D8%AF%D9%86%D9%8A%20%D8%AA%D8%A3%D9%83%D9%8A%D8%AF%20%D8%AD%D8%B6%D9%88%D8%B1%D9%8A%20%D8%AD%D9%81%D9%84%20%D8%A7%D9%84%D8%B2%D9%81%D8%A7%D9%81" class="rsvp-btn" target="_blank" id="rsvpBtn">
                    <i class="fab fa-whatsapp"></i> <span id="rsvpText">تأكيد الحضور عبر واتساب</span>
                </a>
            </div>
            <div class="footer-note" id="footerNote">MOHAMED & JUDY • 2026</div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });
        let isArabic = true;
        function toggleLanguage() {
            isArabic = !isArabic;
            document.body.classList.toggle('en', !isArabic);
            if (isArabic) {
                document.documentElement.dir = "rtl"; document.documentElement.lang = "ar";
                document.getElementById('langText').innerText = "English";
                document.getElementById('subTitle').innerText = "دعوة زفاف فاخرة";
                document.getElementById('namesText').innerText = "محمد & جودي";
                document.getElementById('inviteText').innerText = "يتشرفان بدعوتكم لمشاركتهما أجمل لحظات العمر في حفل الزفاف السعيد";
                document.getElementById('countTitle').innerText = "المتبقي على يومنا المميز:";
                document.getElementById('dateTitle').innerText = "التاريخ"; document.getElementById('dateVal').innerText = "الجمعة، 7 أغسطس 2026";
                document.getElementById('timeTitle').innerText = "الوقت"; document.getElementById('timeVal').innerText = "8:00 مساءً";
                document.getElementById('venueTitle').innerText = "المكان"; document.getElementById('venueVal').innerText = "قاعة ليليتي";
                document.getElementById('rsvpText').innerText = "تأكيد الحضور عبر واتساب";
                document.getElementById('lblDays').innerText = "يوم"; document.getElementById('lblHours').innerText = "ساعة";
                document.getElementById('lblMins').innerText = "دقيقة"; document.getElementById('lblSecs').innerText = "ثانية";
            } else {
                document.documentElement.dir = "ltr"; document.documentElement.lang = "en";
                document.getElementById('langText').innerText = "العربية";
                document.getElementById('subTitle').innerText = "Save The Date";
                document.getElementById('namesText').innerText = "Mohamed & Judy";
                document.getElementById('inviteText').innerText = "Request the honor of your presence at their wedding celebration";
                document.getElementById('countTitle').innerText = "Countdown to our special day:";
                document.getElementById('dateTitle').innerText = "Date"; document.getElementById('dateVal').innerText = "Friday, August 7, 2026";
                document.getElementById('timeTitle').innerText = "Time"; document.getElementById('timeVal').innerText = "8:00 PM";
                document.getElementById('venueTitle').innerText = "Venue"; document.getElementById('venueVal').innerText = "Laylati Hall";
                document.getElementById('rsvpText').innerText = "Confirm Attendance (RSVP)";
                document.getElementById('lblDays').innerText = "Days"; document.getElementById('lblHours').innerText = "Hours";
                document.getElementById('lblMins').innerText = "Mins"; document.getElementById('lblSecs').innerText = "Secs";
            }
        }
        const targetDate = new Date("August 7, 2026 20:00:00").getTime();
        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;
            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);
                document.getElementById("days").innerText = String(days).padStart(2, '0');
                document.getElementById("hours").innerText = String(hours).padStart(2, '0');
                document.getElementById("mins").innerText = String(minutes).padStart(2, '0');
                document.getElementById("secs").innerText = String(seconds).padStart(2, '0');
            } else {
                document.getElementById("days").innerText = "00"; document.getElementById("hours").innerText = "00";
                document.getElementById("mins").innerText = "00"; document.getElementById("secs").innerText = "00";
            }
        }
        setInterval(updateCountdown, 1000); updateCountdown();
        const audio = document.getElementById("pianoAudio");
        const musicIcon = document.getElementById("musicIcon");
        function toggleAudio() {
            if (audio.paused) { audio.play(); musicIcon.className = "fas fa-pause"; }
            else { audio.pause(); musicIcon.className = "fas fa-music"; }
        }
    </script>
</body>
</html>
